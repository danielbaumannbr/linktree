<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Baumann</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        .perfil {
            text-align: center;
            margin-bottom: 30px;
        }

        .perfil img {
            border: 4px solid #fff;
            height: 110px;
            width: 110px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .perfil h1 {
            margin: 15px 0 5px;
        }

        .links {
            width: 90%;
            max-width: 400px;
        }

        .botao {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #fff;
            color: #333;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #ddd;
            transition: all 0.3s ease;
        }

        .botao:hover {
            background-color: #007bff;
            color: #fff;
            border-color: #007bff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        .botao i {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="perfil">
        <img src="image/images.jpg" alt="Foto de Daniel Baumann">
        <h1>Daniel Baumann</h1>
        <p>Bem-vindo aos meus links</p>
    </div>

    <div class="links">
        <a href="https://instagram.com/danielbaumannbr" class="botao" target="_blank">
            <i class="fab fa-instagram"></i> Instagram
        </a>

        <a href="https://youtube.com/@professordanielbaumann" class="botao" target="_blank">
            <i class="fab fa-youtube"></i> YouTube
        </a>

        <a href="https://github.com/danielbaumannbr" class="botao" target="_blank">
            <i class="fab fa-github"></i> GitHub
        </a>

        <a href="https://www.linkedin.com/in/danielbaumannbr" class="botao" target="_blank">
            <i class="fab fa-linkedin"></i> LinkedIn
        </a>

        <a href="mailto:daniel.baumann@edu.sc.senai.br" class="botao">
            <i class="fas fa-envelope"></i> Enviar E-mail
        </a>
    </div>

    <footer>Criado por Daniel Baumann &copy; 2026</footer>

</body>

</html>
