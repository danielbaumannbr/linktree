<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <!-- Configura caracteres especiais (acentos, ç, etc.) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Faz o site se adaptar corretamente a dispositivos móveis -->

    <title>Daniel Baumann</title>
    <!-- Título da aba do navegador -->

    <!-- Biblioteca de ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* =========================
           ESTILIZAÇÃO GERAL DA PÁGINA
        ========================== */

        body {
            background-color: #f3f4f6;
            /* Cor de fundo da página */
            font-family: Arial, Helvetica, sans-serif;
            /* Fonte do texto */
            display: flex;
            /* Ativa o Flexbox */
            flex-direction: column;
            /* Organiza os elementos em coluna */
            align-items: center;
            /* Centraliza horizontalmente */
            padding-top: 50px;
            /* Espaço no topo */
            margin: 0;
            /* Remove margem padrão do navegador */
        }

        /* =========================
           RODAPÉ
        ========================== */

        footer {
            margin-top: 20px;
            /* Espaço acima do rodapé */
            font-size: 12px;
            /* Tamanho pequeno da fonte */
            color: #888;
            /* Cor cinza clara */
        }

        /* =========================
           ÁREA DO PERFIL
        ========================== */

        .perfil {
            text-align: center;
            /* Centraliza o texto */
            margin-bottom: 30px;
            /* Espaço abaixo da seção */
        }

        .perfil img {
            border: 4px solid #fff;
            /* Borda branca */
            height: 110px;
            /* Altura da imagem */
            width: 110px;
            /* Largura da imagem */
            border-radius: 50%;
            /* Deixa a imagem redonda */
            object-fit: cover;
            /* Ajusta a imagem sem distorcer */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            /* Sombra suave */
        }

        .perfil h1 {
            margin: 15px 0 5px;
            /* Espaçamento acima e abaixo do título */
        }

        /* =========================
           CONTAINER DOS LINKS
        ========================== */

        .links {
            width: 90%;
            /* Ocupa 90% da largura da tela */
            max-width: 400px;
            /* Limita a largura máxima */
        }

        /* =========================
           BOTÕES
        ========================== */

        .botao {
            display: flex;
            /* Ativa flexbox para alinhar ícone + texto */
            align-items: center;
            /* Centraliza verticalmente */
            justify-content: center;
            /* Centraliza horizontalmente */
            gap: 10px;
            /* Espaço entre ícone e texto */
            background-color: #fff;
            /* Fundo branco */
            color: #333;
            /* Cor do texto */
            text-decoration: none;
            /* Remove sublinhado do link */
            padding: 15px;
            /* Espaçamento interno */
            margin-bottom: 15px;
            /* Espaço entre botões */
            border-radius: 8px;
            /* Cantos arredondados */
            font-weight: bold;
            /* Texto em negrito */
            border: 1px solid #ddd;
            /* Borda cinza clara */
            transition: all 0.3s ease;
            /* Animação suave */
        }

        /* Efeito quando passa o mouse */
        .botao:hover {
            background-color: #007bff;
            /* Fundo azul */
            color: #fff;
            /* Texto branco */
            border-color: #007bff;
            /* Borda azul */
            transform: translateY(-2px);
            /* Move levemente para cima */
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            /* Sombra azul */
        }

        /* Ícones dentro dos botões */
        .botao i {
            font-size: 18px;
            /* Tamanho do ícone */
        }
    </style>
</head>

<body>

    <div class="perfil">
        <img src="image/images.jpg" alt="Foto de Daniel Baumann">
        <h1>Daniel Baumann</h1>
        <p>Bem-vindo aos meus links</p>
    </div>

    <div class="links">
        <a href="https://instagram.com/danielbaumannbr" class="botao" target="_blank">
            <i class="fab fa-instagram"></i> Instagram
        </a>

        <a href="https://youtube.com/@professordanielbaumann" class="botao" target="_blank">
            <i class="fab fa-youtube"></i> YouTube
        </a>

        <a href="https://github.com/danielbaumannbr" class="botao" target="_blank">
            <i class="fab fa-github"></i> GitHub
        </a>

        <a href="https://www.linkedin.com/in/danielbaumannbr" class="botao" target="_blank">
            <i class="fab fa-linkedin"></i> LinkedIn
        </a>

        <a href="mailto:daniel.baumann@edu.sc.senai.br" class="botao">
            <i class="fas fa-envelope"></i> Enviar E-mail
        </a>

        <a href="https://drive.google.com/drive/folders/1ORDCwbFE97wjGaw4JkiJqU-mY-i-qEAD?usp=drive_link" class="botao"
            target="_blank">
            <i class="fa-solid fa-user-graduate"></i>Área do Aluno
        </a>
    </div>
    <footer>Criado por Daniel Baumann &copy; 2026</footer>

</body>

</html>
